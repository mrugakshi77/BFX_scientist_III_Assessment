[workspace]
authors = ["Candidate <candidate@example.com>"]
channels = ["conda-forge"]
name = "multiomic-panel-assignment"
platforms = ["win-64", "linux-64", "osx-64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"
numpy = ">=1.26,<3"
pandas = ">=2.1,<3"
scikit-learn = ">=1.4,<2"
scipy = ">=1.11,<2"
pyyaml = ">=6.0,<7"
pytest = ">=8.0,<9"

[tasks]
analysis = "python scripts/run_analysis.py --config config.yaml"
test = "python -m pytest tests"

